rtc_raven_hint: |-
  클릭해서 정보 확인
  까악!
rtc_drag_hint: |-
  제목을 누른 채 위아래로 끌기
  순서가 자동 저장됩니다.
rtc_reset: 초기화
rtc_collapsed_title: 접어 둔 항목
rtc_collapsed_help: |-
  접어 둔 항목의 제목을 누르면 목록을 펼치거나 접을 수 있습니다. 게임패드는 이 제목을 선택한 뒤 A 버튼을 누르세요. + 버튼으로 항목을 원래 목록에 되돌립니다.

  항목 제목을 누른 채 위아래로 끌어 금색 선에 놓으면 같은 그룹 안에서 순서가 바뀌고 자동 저장됩니다. 목록 위아래 가장자리에서는 자동으로 스크롤됩니다. 목록 밖에 놓으면 취소됩니다. 초기화는 현재 도감에 있는 항목만 되돌립니다.
